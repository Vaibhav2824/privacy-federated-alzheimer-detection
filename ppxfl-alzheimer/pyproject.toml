[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppxfl"
version = "1.0.0"
description = "Privacy-preserving and explainable federated learning for Alzheimer's disease detection from MRI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vaibhav2824", email = "gvaibhav2824@gmail.com" }]
keywords = ["federated-learning", "differential-privacy", "explainable-ai", "alzheimers", "mri"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0",
    "torchvision>=0.15",
    "opacus>=1.4",
    # Neuroimaging preprocessing (src/preprocess_v3.py and src/orientation*.py):
    # nibabel reads the scans, nilearn supplies the MNI152 and ICBM152
    # templates and the Harvard-Oxford atlas, dipy performs the affine
    # registration, and deepbet performs skull stripping.
    "nibabel>=5.0",
    "nilearn>=0.10",
    "dipy>=1.8",
    "deepbet>=1.0",
]

[project.optional-dependencies]
# onnx, onnxruntime and onnxscript back src/export_onnx.py and its tests. torch
# 2.6 and later route torch.onnx.export through the dynamo exporter, which
# imports onnxscript, so it is required rather than optional on newer torch.
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "ppxfl[export]",
]

[project.urls]
Repository = "https://github.com/Vaibhav2824/privacy-federated-alzheimer-detection"

[tool.setuptools]
packages = ["ppxfl"]

[tool.setuptools.package-dir]
ppxfl = "src"

[tool.pytest.ini_options]
# The tests import the modules as ``src.*``, which is the layout on disk and in
# the repository. The installed distribution exposes the same code as ``ppxfl``,
# so without this a CI runner that installs the package finds ``ppxfl`` and not
# ``src``, and every test module fails to import. Putting the project root on
# the path makes the two spellings agree.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["colab_runner.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    # The training scripts read top-down as procedures; a few long lines and
    # loop-shadowed names are clearer than the refactors that would silence these.
    "E501",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

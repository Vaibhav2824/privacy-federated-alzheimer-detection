[pytest]
testpaths = tests
addopts = -q
# The tests import the code as ``src.*``, which is the layout on disk and in the
# repository; the installed distribution exposes the same modules as ``ppxfl``.
# Running as ``python -m pytest`` puts the working directory on sys.path and
# hides the difference, but a bare ``pytest`` -- which is what CI runs -- does
# not, and every test module then fails to import. This makes the two spellings
# agree however pytest is invoked.
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
